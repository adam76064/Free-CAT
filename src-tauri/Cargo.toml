[package]
name = "free-cat"
version = "0.2.0"
description = "Free, open-source professional CAT tool"
authors = ["Free-CAT Contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "free_cat_lib"
crate-type = ["rlib"]

[[bin]]
name = "free-cat"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Tauri build config
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri core ────────────────────────────────────────────────────────────────
tauri           = { version = "2", features = ["devtools"] }
tauri-plugin-fs     = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell  = "2"

# ── Async runtime ─────────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Database ──────────────────────────────────────────────────────────────────
rusqlite = { version = "0.31", features = ["bundled", "backup", "hooks"] }
# bundled = compiles SQLite with FTS5 enabled

# ── Serialization ─────────────────────────────────────────────────────────────
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
toml        = "0.8"

# ── Text / NLP ────────────────────────────────────────────────────────────────
strsim               = "0.11"   # Levenshtein, Dice, Jaro-Winkler
unicode-segmentation = "1.12"   # Grapheme cluster / word boundary segmentation

# ── XML parsing (XLIFF, TMX, TBX, SRX) ───────────────────────────────────────
quick-xml = { version = "0.36", features = ["serialize"] }

# ── ZIP (DOCX, XLSX, PPTX, IDML, .sdlppx are all ZIP archives) ───────────────
zip = "2"

# ── HTTP clients (MT / AI APIs) ───────────────────────────────────────────────
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# ── Error handling ────────────────────────────────────────────────────────────
anyhow  = "1"
thiserror = "1"

# ── Logging ───────────────────────────────────────────────────────────────────
log          = "0.4"
tauri-plugin-log = "2"

# ── Locking (no poisoning: one panicking command can never wedge the app state)
parking_lot = "0.12"

# ── Secrets (OS keychain) ─────────────────────────────────────────────────────
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# ── UUID generation ───────────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4"] }

# ── Date / Time ───────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ── Regex (QA rules engine) ───────────────────────────────────────────────────
regex = "1"

